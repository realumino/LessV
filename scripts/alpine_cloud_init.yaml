#cloud-config
# WHAT: first boot for a disposable Alpine (OpenRC) LessV node. The same
# file works on any provider whose Alpine 3.22+ image runs cloud-init.
# WHY: a node is cattle. This file raises the socket/fd ceilings, installs the
# pinned lessv-node release, enrolls it, and leaves no remote shell behind.
# There is no Tailscale, no configuration management agent, and no package
# upgrade step: a host that drifts or breaks is destroyed and rebuilt from
# this file plus the plane.
#
# The four values in the marked lessv.env block below are the only per-node
# edits (NODE_ID, CP_URL, TOKEN, VERSION). The token is intentionally in user
# data (the operator's current trade-off): the plane can revoke it by deleting
# the node row, and the host has no SSH listener after first boot. The
# Linode-specific helper `scripts/linode_provision.mjs` can render this file,
# but it is not required; the operator manual documents the manual paste.
manage_etc_hosts: false
ssh_pwauth: false

package_update: true
packages:
  - ca-certificates
  - curl
  - nftables
  - nftables-openrc
  - tar
  - unzip

write_files:
  # ===================== EDIT THIS BLOCK =====================
  # NODE_ID  plane node id (1-32 lowercase letters/digits)
  # CP_URL   control-plane base URL, no trailing slash
  # TOKEN    value returned once by POST /api/admin/nodes/<NODE_ID>/token
  # VERSION  published node release, e.g. 0.6.0
  # Everything below this block is generic and should not be edited.
  # ===========================================================
  - path: /root/lessv.env
    owner: root:root
    permissions: '0600'
    content: |
      NODE_ID="__NODE_ID__"
      CP_URL="__CP_URL__"
      TOKEN="__TOKEN__"
      VERSION="__VERSION__"

  # sshd is not merely stopped: cloud-init's own cc_ssh module calls
  # `rc-service sshd restart`, and a default-runlevel start can race the
  # cleanup below. A no-op init script makes every path a no-op.
  - path: /etc/init.d/sshd
    owner: root:root
    permissions: '0755'
    content: |
      #!/sbin/openrc-run
      description="sshd (disabled by LessV)"
      start() { ewarn "sshd is disabled on this node"; return 0; }
      stop() { return 0; }
      status() { return 3; }

  # BBR keeps a long-haul proxy usable under loss; the socket/file ceilings
  # match the 1,000,000 fd limit in the shipped unit files. Forwarding is
  # deliberately absent: this host terminates its own TLS and routes nothing.
  - path: /etc/sysctl.d/99-lessv.conf
    owner: root:root
    permissions: '0644'
    content: |
      fs.file-max = 2097152
      net.core.default_qdisc = fq
      net.ipv4.tcp_congestion_control = bbr
      net.core.somaxconn = 1024
      net.core.netdev_max_backlog = 2500
      net.ipv4.tcp_fastopen = 3
      net.ipv4.tcp_syncookies = 1
      net.ipv4.tcp_mtu_probing = 1
      net.ipv4.tcp_keepalive_time = 150
      net.ipv4.tcp_keepalive_intvl = 15
      net.ipv4.tcp_keepalive_probes = 3
      net.ipv4.tcp_tw_reuse = 1

  # Input fallback: drop everything except the two service ports. The ICMP
  # and DHCP exceptions keep TCP/IP correct (PMTU, IPv6 ND) and survive a
  # DHCP-based image; they expose no service. 22 is absent because sshd is
  # stopped and removed from the runlevels below. Staged under /root because
  # the nftables package owns /etc/nftables.nft and is installed after this
  # file is written; the bootstrap installs it at the real path afterwards.
  - path: /root/lessv.nft
    owner: root:root
    permissions: '0644'
    content: |
      #!/usr/sbin/nft -f
      flush ruleset
      table inet lessv {
          chain input {
              type filter hook input priority filter; policy drop;
              iifname "lo" accept
              ct state established,related accept
              ct state invalid drop
              tcp dport { 80, 443 } accept
              icmp type { destination-unreachable, time-exceeded, parameter-problem } accept
              icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, parameter-problem, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept
              udp sport 67 udp dport 68 accept
              udp sport 547 udp dport 546 accept
          }
          chain forward {
              type filter hook forward priority filter; policy drop;
          }
          chain output {
              type filter hook output priority filter; policy accept;
          }
      }

  # Load the congestion control and qdisc modules on later boots, before the
  # sysctl service applies the file above. Harmless when the kernel has them
  # built in (modprobe is quiet).
  - path: /etc/modules-load.d/lessv.conf
    owner: root:root
    permissions: '0644'
    content: |
      tcp_bbr
      sch_fq

  - path: /root/lessv-bootstrap.sh
    owner: root:root
    permissions: '0700'
    content: |
      #!/bin/sh
      set -eu

      WORK=""

      cleanup() {
          status=$?
          if [ -n "$WORK" ]; then
              rm -rf "$WORK"
          fi
          rm -f /root/lessv.env /root/lessv.nft /root/lessv-bootstrap.sh
          # No remote shell, on success or failure. The provider console
          # (with whatever root password the image or operator set) is the
          # only console, and a host that cannot converge is destroyed
          # rather than repaired.
          rc-update del sshd default >/dev/null 2>&1 || true
          rc-update del sshd boot >/dev/null 2>&1 || true
          rc-service sshd stop >/dev/null 2>&1 || true
          exit "$status"
      }
      trap cleanup EXIT

      rc-update del sshd default >/dev/null 2>&1 || true
      rc-update del sshd boot >/dev/null 2>&1 || true
      rc-service sshd stop >/dev/null 2>&1 || true

      # The only per-node values live here. Remove the file immediately so
      # the token is not left on disk; user data still holds it (see below).
      . /root/lessv.env
      rm -f /root/lessv.env
      : "${NODE_ID:?NODE_ID is empty in the lessv.env block}"
      : "${CP_URL:?CP_URL is empty in the lessv.env block}"
      : "${TOKEN:?TOKEN is empty in the lessv.env block}"
      : "${VERSION:?VERSION is empty in the lessv.env block}"
      # Quoted pieces keep the renderer from substituting this guard along
      # with the env block above.
      case "$NODE_ID$CP_URL$TOKEN$VERSION" in
          *"__"NODE_ID"__"*|*"__"CP_URL"__"*|*"__"TOKEN"__"*|*"__"VERSION"__"*)
              echo "a template placeholder in the lessv.env block was not replaced" >&2
              exit 1
              ;;
      esac
      BASE="https://gitee.com/realumino/lessv/releases/download/node-v${VERSION}"
      hostname "$NODE_ID" 2>/dev/null || true
      printf '%s\n' "$NODE_ID" > /etc/hostname

      mkdir -p /etc/modules-load.d
      rc-update add sysctl boot >/dev/null 2>&1 || true
      modprobe tcp_bbr 2>/dev/null || true
      modprobe sch_fq 2>/dev/null || true
      if ! sysctl -p /etc/sysctl.d/99-lessv.conf >/dev/null 2>&1; then
          echo "warning: sysctl rejected at least one key in /etc/sysctl.d/99-lessv.conf" >&2
      fi
      if [ "$(sysctl -n net.ipv4.tcp_congestion_control 2>/dev/null || true)" != "bbr" ]; then
          echo "warning: bbr is unavailable on this kernel; keeping the default CCA" >&2
      fi

      # The fallback is part of the host's contract: if it cannot load, stop
      # before enrolling a node that would be reachable on unlisted ports.
      # Install after apk: the nftables package ships its own /etc/nftables.nft.
      install -m 0644 /root/lessv.nft /etc/nftables.nft
      rc-update add nftables boot >/dev/null 2>&1 || true
      rc-service nftables restart
      echo "firewall loaded (input: tcp 80/443 only)"

      # The control plane may be behind a cold DNS answer; install.sh must
      # not burn its one-shot cloud-init run on a transient network error.
      attempt=0
      until curl -fsS --max-time 5 "$CP_URL/api/health" >/dev/null 2>&1; do
          attempt=$((attempt + 1))
          if [ "$attempt" -ge 60 ]; then
              echo "control plane unreachable: $CP_URL/api/health" >&2
              exit 1
          fi
          sleep 3
      done

      case "$(uname -m)" in
          x86_64|amd64) ARCH=amd64 ;;
          aarch64|arm64) ARCH=arm64 ;;
          *) echo "unsupported architecture: $(uname -m)" >&2; exit 1 ;;
      esac
      NAME="lessv-node-${VERSION}-linux-${ARCH}"
      WORK=$(mktemp -d)

      attempt=0
      while :; do
          if curl -fsSL --max-time 120 -o "$WORK/bundle.tar.gz" "$BASE/$NAME.tar.gz" \
              && curl -fsSL --max-time 60 -o "$WORK/SHA256SUMS" "$BASE/SHA256SUMS"; then
              break
          fi
          attempt=$((attempt + 1))
          if [ "$attempt" -ge 5 ]; then
              echo "cannot download ${BASE}/${NAME}.tar.gz" >&2
              exit 1
          fi
          sleep 5
      done

      expected=$(sed -n "s/^\([0-9a-f]\{64\}\) [ *]${NAME}\.tar\.gz$/\1/p" "$WORK/SHA256SUMS" | head -n 1)
      if [ -z "$expected" ]; then
          echo "SHA256SUMS does not list ${NAME}.tar.gz" >&2
          exit 1
      fi
      actual=$(sha256sum "$WORK/bundle.tar.gz" | cut -d' ' -f1)
      if [ "$expected" != "$actual" ]; then
          echo "sha256 mismatch for ${NAME}.tar.gz" >&2
          exit 1
      fi

      mkdir -p "$WORK/extract"
      tar -xzf "$WORK/bundle.tar.gz" -C "$WORK/extract"
      BUNDLE="$WORK/extract/$NAME"
      if [ ! -x "$BUNDLE/install.sh" ]; then
          # The tarball can be assembled on a non-POSIX host; the checksum
          # already proved the bytes, so fix the mode instead of refusing.
          chmod 0755 "$BUNDLE/install.sh" 2>/dev/null || true
      fi

      printf '%s\n' "$TOKEN" | "$BUNDLE/install.sh" --cp "$CP_URL" --node "$NODE_ID"
      echo "lessv-node ${VERSION} enrolled on ${NODE_ID}"

runcmd:
  - [ /bin/sh, /root/lessv-bootstrap.sh ]
